name: Kball build and career tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Engine, save, and legacy regressions
        run: |
          npm test
          npm run test:legacy
      - name: Production build
        run: npm run build
      - name: Browser runtime
        run: npx playwright install --with-deps chromium
      - name: Start built application
        run: |
          npm run preview > /tmp/kball-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kball-preview.log
          exit 1
      - name: Career and persistence browser flow
        run: npm run test:e2e
      - name: Preserved legacy browser flow
        run: node tests/v55-browser.test.mjs
      - name: Browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kball-browser-diagnostics
          path: test-results
          if-no-files-found: ignore
