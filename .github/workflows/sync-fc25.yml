name: Sync CAREER24 data

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-fc25.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download FC25 player database
        run: |
          mkdir -p data
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/inboxpraveen/FIFA-Player-Recomendation/main/new-data/male_players.csv" \
            -o data/male_players.csv

      - name: Build deterministic football crest index
        run: |
          rm -rf /tmp/football-logos
          git clone --depth 1 https://github.com/JoseArroyave/football-logos.git /tmp/football-logos
          python - <<'PY'
          import json, unicodedata, re
          from pathlib import Path

          root = Path("/tmp/football-logos/logos")
          out = Path("data/logos.json")
          entries = {}
          plain = {}

          def norm(s):
              s = unicodedata.normalize("NFD", s)
              s = "".join(ch for ch in s if unicodedata.category(ch) != "Mn")
              s = s.lower().replace("&", "and")
              return re.sub(r"[^a-z0-9]+", "", s)

          for country_dir in root.iterdir():
              if not country_dir.is_dir():
                  continue
              country = country_dir.name
              for p in country_dir.glob("*.svg"):
                  stem = p.stem
                  url = f"https://cdn.jsdelivr.net/gh/JoseArroyave/football-logos@main/logos/{country}/{p.name}"
                  entries[f"{country}|{stem}"] = url
                  k = norm(stem)
                  plain.setdefault(k, []).append(url)

          # Globally-unique filename aliases are safe fallbacks.
          for k, urls in plain.items():
              if len(urls) == 1:
                  entries[f"*|{k}"] = urls[0]

          out.write_text(json.dumps(entries, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          print("crest index entries:", len(entries))
          if len(entries) < 2000:
              raise SystemExit("crest index unexpectedly small")
          PY

      - name: Commit local DB and crest index
        run: |
          git config user.name "career24-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/male_players.csv data/logos.json
          git diff --cached --quiet && exit 0
          git commit -m "Sync FC25 player DB and deterministic club crest index"
          git push
